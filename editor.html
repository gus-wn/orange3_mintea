<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학습지 편집기</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/mingti-pixel.png">
<style>
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Galmuri11";src:url("fonts/Galmuri11-Bold.woff2") format("woff2");font-weight:700}
/* Layout: 위쪽 도구 막대 + 그 아래 학습지 미리보기(iframe)를 바로 고치는 편집 화면 */
:root{color-scheme:light;--sky:#cfeaf8;--blue:#7fc0e6;--line:#33506b;--brown:#8a5a3c;--pink:#f2a3b4;--cream:#fbf4e2;--white:#fff;--ok:#2c7a3f;--no:#b4381c;
  --pixel:"Galmuri11",system-ui,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--sky);color:var(--line);font-family:var(--pixel);font-size:14px}
.tb{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--cream);border-bottom:4px solid var(--line);
  padding-block:calc(env(safe-area-inset-top,0px) + 8px) 8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.tb a.back{color:var(--line);text-decoration:none;font-weight:700}
.tb .name{font-weight:700;color:var(--brown)}
.tb .status{font-size:.82rem;color:#5f7488}
.tb .status.dirty{color:var(--no)}
.tb .status.ok{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto;align-items:center}
button,.btn{font:inherit;font-size:.85rem;padding:5px 12px;background:var(--white);color:var(--line);border:0;cursor:pointer;text-decoration:none;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line);margin:2px}
button:hover,.btn:hover{background:#fde3e9}
button:active{transform:translate(1px,1px)}
button:focus-visible,.btn:focus-visible{outline:3px dashed var(--pink);outline-offset:4px}
button.primary{background:var(--brown);color:var(--white)}
button.primary:hover{background:#6f462e}
button:disabled{opacity:.5;cursor:not-allowed}
.imgbar{display:flex;gap:6px;align-items:center;background:#fde3e9;padding:6px 12px;border-bottom:2px solid var(--line);font-size:.85rem}
.help{background:var(--white);border-bottom:2px solid var(--line);padding:6px 12px;font-size:.8rem;color:#5f7488}
iframe{flex:1;width:100%;border:0;background:#e4e8eb}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--line);color:var(--white);padding:8px 16px;font-size:.88rem;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="tb">
  <a class="back" href="teacher.html">← 선생님 화면</a>
  <span class="name" id="fname">불러오는 중…</span>
  <span class="status" id="status"></span>
  <div class="tools">
    <button type="button" id="bBold" title="선택한 글자를 굵게"><b>B</b> 굵게</button>
    <button type="button" id="bUndo" title="방금 고친 것 되돌리기">되돌리기</button>
    <button type="button" id="bImg" title="커서가 있는 곳 아래에 그림 넣기">그림 넣기</button>
    <a class="btn" id="bView" target="_blank" rel="noopener">학생 화면 보기</a>
    <button type="button" class="primary" id="bSave">GitHub에 저장</button>
  </div>
</header>
<div class="imgbar" id="imgbar" hidden>
  <span>선택한 그림:</span>
  <button type="button" id="miReplace">다른 그림으로 바꾸기</button>
  <button type="button" id="miDel">그림 지우기</button>
  <button type="button" id="miClose">선택 해제</button>
</div>
<div class="help">점선 상자 안의 글씨를 눌러 바로 고칠 수 있어요. 그림을 누르면 바꾸거나 지울 수 있고, 새 그림은 글씨를 한 번 누른 뒤 '그림 넣기'를 누르면 그 아래에 들어가요.</div>
<input type="file" id="picker" accept="image/*" hidden>
<iframe id="fr" title="학습지 편집 화면"></iframe>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const OWNER="gus-wn",REPO="orange3_mintea",BRANCH="main",TOKEN_KEY="mintea-gh-token";
  const FILES={
    "worksheet0.html":{title:"0. Orange3로 해보는 데이터 분석",open:'<div class="sheet">'},
    "worksheet.html":{title:"1. 개인에 관한 신상정보로 소득 정도를 예측할 수 있을까?",open:'<div class="sheet">'},
    "index.html":{title:"학생 첫 화면",open:'<div class="wrap">'},
    "lesson.html":{title:"교사용 수업 자료",open:'<div class="wrap">'}
  };
  const $=id=>document.getElementById(id);
  const file=new URLSearchParams(location.search).get("file")||"worksheet0.html";
  const cfg=FILES[file];
  const fr=$("fr");
  let src="",sha=null,dirty=false,lastEd=null,selImg=null,pickMode="insert",seq=0;
  const pending=new Map();

  const toast=(m,ms=3000)=>{$("toast").textContent=m;$("toast").hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>$("toast").hidden=true,ms)};
  const setStatus=(m,cls="")=>{$("status").textContent=m;$("status").className="status "+cls};
  const token=()=>{try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return""}};
  const markDirty=()=>{if(!dirty){dirty=true;setStatus("저장 안 한 변경이 있어요","dirty")}};
  window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

  if(!cfg){$("fname").textContent="편집할 수 없는 파일이에요";return}
  $("fname").textContent=cfg.title;
  $("bView").href=file;
  document.title=cfg.title+" 편집";

  // GitHub API
  async function gh(path,opt={}){
    const url=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path.split("/").map(encodeURIComponent).join("/")}`+(opt.method?"":`?ref=${BRANCH}&t=${Date.now()}`);
    const r=await fetch(url,{method:opt.method||"GET",cache:"no-store",headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+token(),"X-GitHub-Api-Version":"2022-11-28"},body:opt.body});
    if(!r.ok){const e=await r.json().catch(()=>({}));const err=new Error(e.message||("HTTP "+r.status));err.status=r.status;throw err}
    return r.json();
  }
  const b64ToText=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
  const bytesToB64=b=>{let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)};
  const explain=e=>e.status===401?"GitHub 연결이 끊겼어요. 선생님 화면에서 토큰을 다시 넣어 주세요."
    :e.status===403||e.status===404?"이 토큰에는 저장소에 쓸 권한이 없어요. 토큰 권한(Contents: Read and write)을 확인해 주세요."
    :e.status===409?"다른 곳에서 먼저 고친 내용이 있어요. 새로고침한 뒤 다시 고쳐 주세요."
    :"저장하지 못했어요: "+e.message;

  // 불러오기
  async function load(){
    try{
      if(token()){const j=await gh(file);src=b64ToText(j.content);sha=j.sha}
      else{const r=await fetch(file+"?t="+Date.now(),{cache:"no-store"});src=await r.text();$("bSave").disabled=true;
        setStatus("GitHub에 연결하지 않아 저장할 수 없어요. 선생님 화면에서 먼저 연결해 주세요.","dirty")}
    }catch(e){setStatus("불러오지 못했어요: "+explain(e),"dirty");return}
    if(src.indexOf(cfg.open)<0){setStatus("이 파일의 구조가 바뀌어 편집할 수 없어요.","dirty");return}
    const doc=new DOMParser().parseFromString(src,"text/html");
    doc.querySelectorAll("script").forEach(s=>s.remove());
    const base=doc.createElement("base");base.href=new URL(".",location.href).href;doc.head.prepend(base);
    const st=doc.createElement("style");
    st.textContent=`[data-ed]{outline:1px dashed rgba(212,98,26,.45);outline-offset:2px;cursor:text}
[data-ed]:hover{outline-color:#d4621a}[data-ed]:focus{outline:2px solid #d4621a;background:rgba(253,238,227,.6)}
img{cursor:pointer}img:hover{outline:3px solid #17697a}img.ed-sel{outline:4px solid #d4621a!important}`;
    doc.head.append(st);
    fr.srcdoc="<!doctype html>\n"+doc.documentElement.outerHTML;
  }

  fr.addEventListener("load",()=>{
    const d=fr.contentDocument;if(!d||!d.body)return;
    const root=d.querySelector(rootSel());if(!root)return;
    root.querySelectorAll("details:not([open])").forEach(x=>{x.open=true;x.setAttribute("data-ed-open","")});
    const skipTags=new Set(["SCRIPT","STYLE","INPUT","SELECT","OPTION","TEXTAREA","BUTTON","IMG","TABLE","THEAD","TBODY","TR","UL","OL","FIGURE","SECTION","HEADER","FOOTER","NAV","MAIN"]);
    for(const el of root.querySelectorAll("*")){
      if(skipTags.has(el.tagName)||el.closest("svg")||el.closest("[data-ed]"))continue;
      const hasText=[...el.childNodes].some(n=>n.nodeType===3&&n.textContent.trim());
      if(!hasText||el.querySelector("svg,textarea,canvas,img,figure,table,ul,ol"))continue;
      el.setAttribute("contenteditable","true");el.setAttribute("data-ed","");el.spellcheck=false;
      el.querySelectorAll("button,input,select").forEach(c=>c.setAttribute("contenteditable","false"));
    }
    d.addEventListener("click",e=>{
      const a=e.target.closest("a,summary,button,label");if(a)e.preventDefault();
      const img=e.target.closest("img");
      if(img&&root.contains(img)){selectImg(img);return}
      if(!e.target.closest("[data-ed]"))selectImg(null);
    },true);
    d.addEventListener("focusin",e=>{const ed=e.target.closest&&e.target.closest("[data-ed]");if(ed)lastEd=ed});
    d.addEventListener("input",markDirty);
    d.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});
    d.addEventListener("paste",e=>{const ed=e.target.closest&&e.target.closest("[data-ed]");if(!ed)return;e.preventDefault();
      const t=(e.clipboardData||window.clipboardData).getData("text/plain");d.execCommand("insertText",false,t)});
    if(!dirty&&token())setStatus("고칠 준비가 됐어요");
  });
  const rootSel=()=>cfg.open.includes("sheet")?".sheet":".wrap";

  function selectImg(img){
    if(selImg)selImg.classList.remove("ed-sel");
    selImg=img;$("imgbar").hidden=!img;
    if(img)img.classList.add("ed-sel");
  }

  // 도구
  $("bBold").onclick=()=>{fr.contentDocument.execCommand("bold");markDirty()};
  $("bUndo").onclick=()=>{fr.contentDocument.execCommand("undo")};
  $("bImg").onclick=()=>{pickMode="insert";$("picker").value="";$("picker").click()};
  $("miReplace").onclick=()=>{if(!selImg)return;pickMode="replace";$("picker").value="";$("picker").click()};
  $("miDel").onclick=()=>{if(!selImg)return;const f=selImg.closest("figure")||selImg;f.remove();selectImg(null);markDirty();toast("그림을 지웠어요. 저장해야 반영돼요.")};
  $("miClose").onclick=()=>selectImg(null);
  document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){e.preventDefault();save()}});

  async function shrink(f){
    const bmp=await createImageBitmap(f);const max=1400,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,"image/jpeg",0.86));
  }
  $("picker").onchange=async()=>{
    const f=$("picker").files[0];if(!f)return;
    let blob;try{blob=await shrink(f)}catch(e){toast("이 파일은 그림으로 열 수 없어요. JPG나 PNG를 골라 주세요.");return}
    const id="n"+(++seq),url=URL.createObjectURL(blob);pending.set(id,blob);
    const d=fr.contentDocument;
    if(pickMode==="replace"&&selImg){selImg.src=url;selImg.removeAttribute("srcset");selImg.setAttribute("data-ed-new",id);selImg.removeAttribute("data-ed-path")}
    else{
      const fig=d.createElement("figure");fig.className="fig";
      const img=d.createElement("img");img.src=url;img.alt=f.name.replace(/\.[^.]+$/,"");img.setAttribute("data-ed-new",id);
      const cap=d.createElement("figcaption");cap.textContent="그림 설명을 적어 주세요";cap.setAttribute("contenteditable","true");cap.setAttribute("data-ed","");
      fig.append(img,cap);
      const root=d.querySelector(rootSel());
      let anchor=lastEd&&root.contains(lastEd)?lastEd:null;
      if(anchor){while(anchor.parentElement&&anchor.parentElement!==root&&!anchor.parentElement.matches("section,.act,.q,.concept,main,.read,.figs"))anchor=anchor.parentElement;
        if(anchor.parentElement&&anchor.parentElement.matches(".read,.figs"))anchor=anchor.parentElement;anchor.after(fig)}
      else{(root.querySelector("section")||root).append(fig)}
      fig.scrollIntoView({behavior:"smooth",block:"center"});
    }
    markDirty();toast("그림을 넣었어요. 저장해야 학생 화면에 반영돼요.");
  };

  // 저장
  async function save(){
    if(!token()){toast("먼저 선생님 화면에서 GitHub에 연결해 주세요.");return}
    if(!dirty){toast("바뀐 내용이 없어요.");return}
    const btn=$("bSave");btn.disabled=true;setStatus("저장 중…");
    try{
      const d=fr.contentDocument;
      const news=[...d.querySelectorAll("img[data-ed-new]")];
      for(let i=0;i<news.length;i++){
        const img=news[i],id=img.getAttribute("data-ed-new"),blob=pending.get(id);if(!blob)continue;
        const stamp=new Date().toISOString().replace(/[-:T.Z]/g,"").slice(0,14);
        const path=`img/uploads/${stamp}-${i+1}.jpg`;
        setStatus(`그림 올리는 중… (${i+1}/${news.length})`);
        await gh(path,{method:"PUT",body:JSON.stringify({message:`그림 추가: ${path}`,content:bytesToB64(new Uint8Array(await blob.arrayBuffer())),branch:BRANCH})});
        img.removeAttribute("data-ed-new");img.setAttribute("data-ed-path",path);pending.delete(id);
      }
      const root=d.querySelector(rootSel()).cloneNode(true);
      root.querySelectorAll("[data-ed-path]").forEach(e=>{e.setAttribute("src",e.getAttribute("data-ed-path"));e.removeAttribute("data-ed-path")});
      root.querySelectorAll("[data-ed]").forEach(e=>e.removeAttribute("data-ed"));
      root.querySelectorAll("[contenteditable]").forEach(e=>e.removeAttribute("contenteditable"));
      root.querySelectorAll("[spellcheck]").forEach(e=>e.removeAttribute("spellcheck"));
      root.querySelectorAll('[style=""]').forEach(e=>e.removeAttribute("style"));
      root.querySelectorAll("[data-ed-open]").forEach(e=>{e.removeAttribute("open");e.removeAttribute("data-ed-open")});
      root.querySelectorAll(".ed-sel").forEach(e=>{e.classList.remove("ed-sel");if(!e.getAttribute("class"))e.removeAttribute("class")});
      const start=src.indexOf(cfg.open);
      let end=src.indexOf("<script",start);if(end<0)end=src.lastIndexOf("</body>");
      const html=src.slice(0,start)+root.outerHTML+"\n\n"+src.slice(end);
      setStatus("학습지 저장 중…");
      const res=await gh(file,{method:"PUT",body:JSON.stringify({message:`${cfg.title} 수정`,content:bytesToB64(new TextEncoder().encode(html)),sha,branch:BRANCH})});
      sha=res.content.sha;src=html;dirty=false;
      setStatus("저장했어요. 1~2분 뒤 학생 화면에 반영돼요.","ok");toast("GitHub에 저장했어요!");
    }catch(e){setStatus(explain(e),"dirty");toast(explain(e),6000)}
    finally{btn.disabled=!token()}
  }
  $("bSave").onclick=save;

  load();
})();
</script>
</body>
</html>
